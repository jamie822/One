name: Deploy client preview

# Builds a client site from clients/<name>/ and publishes it to GitHub Pages
# so it can be viewed on a real URL — on a phone, or sent to the client.
#
# Note: a repo has one Pages site. Running this replaces whatever is currently
# published at https://jamie822.github.io/One/. The agency site on the default
# branch can be republished any time by re-running its own workflow.

on:
  push:
    branches:
      - claude/electrician-website-template-a3751a
    paths:
      - 'clients/**'
      - '.github/workflows/deploy-client.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        working-directory: clients/swift-electrical
        env:
          BASE_PATH: /One/
        run: |
          npm install --no-audit --no-fund
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: clients/swift-electrical/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

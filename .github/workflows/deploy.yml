name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages on every push to the
# working branch. The live URL will be:  https://<owner>.github.io/<repo>/
#
# ONE-TIME SETUP (repo owner): GitHub → Settings → Pages → "Build and
# deployment" → Source: "GitHub Actions". After that this runs automatically.

on:
  push:
    branches:
      - claude/electrical-industry-site-research-vogg2n
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (with Pages sub-path)
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
